name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sim bauen (assets/index.html)
        run: python3 tools/build_sim.py

      - name: APK bauen (Release, debug-signiert)
        run: gradle -p . :app:assembleRelease --no-daemon

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: testfeld07-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
