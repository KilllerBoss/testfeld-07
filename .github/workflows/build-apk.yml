name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (vorinstalliertes Runner-SDK, kein Legacy-'tools')
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "SDK-Komponenten bereit: platform 34, build-tools 34.0.0"

      - name: Hart-Prüfungen (kein Fallback)
        run: |
          set -e
          # 1. WASM-Magie
          head -c 4 app/src/main/assets/www/vendor/mujoco.wasm | od -A n -t x1 | tr -d ' \n' | grep -q '^0061736d$'
          echo "WASM-Magie OK (0061736d)"
          # 2. Keine Alt-Elemente / kein Pre-Order
          ! grep -ri "pre-order\|predator\|Armbot\|Original (ONNX)" app/src/main/assets/www/js app/src/main/assets/www/index.html
          echo "Keine Alt-Elemente OK"
          # 3. Drei Roboter vorhanden (v2.14.0: A1/Spot/Go2 entfernt)
          for r in unitree_g1 pollen_microduck skydio_x2; do
            test -f "app/src/main/assets/www/models/$r/manifest.json"
          done
          echo "3 Modelle OK (Microduck + G1 + X2)"
          # 4. GLB-Pipeline vorhanden
          test -f app/src/main/assets/www/js/retarget.js
          test -f app/src/main/assets/www/js/glb.js
          echo "GLB-Pipeline OK"

      - name: Keystore-Prüfung (stabile Signatur, kein Fallback)
        run: |
          test -s trainrobot.keystore
          echo "trainrobot.keystore vorhanden (Signatur CN=Trainrobot, OU=Testfeld07)"

      - name: Build (lertrain.apk)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Umbenennen + Prüfsumme
        run: |
          cp app/build/outputs/apk/release/app-release.apk lertrain.apk
          sha256sum lertrain.apk

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lertrain.apk
          path: lertrain.apk

      - name: Release bei Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lertrain.apk
          generate_release_notes: true
