<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>Testfeld·07</title>
<style>
/* Testfeld·07 — BIOS/Werkstatt-Look (Palette vom microduck-Space: INK + Orange) */
:root {
  --ink: #08080c;
  --ink2: #101018;
  --orange: #ff7a2f;
  --txt: rgba(255, 255, 255, 0.86);
  --txt-dim: rgba(255, 255, 255, 0.45);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--txt); font-family: var(--sans); touch-action: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud button, #hud input, #hud form { pointer-events: auto; }
.hidden { display: none !important; }

/* ---------- Topbar ---------- */
#topbar {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: linear-gradient(180deg, rgba(8,8,12,0.85), rgba(8,8,12,0));
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }
#logo {
  font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: 2px;
  color: var(--orange); border: 1px solid rgba(255,122,47,0.5); border-radius: 6px;
  padding: 4px 8px; background: rgba(8,8,12,0.6); white-space: nowrap;
}
.chips { display: flex; gap: 4px; }
.chip {
  font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
  color: var(--txt-dim); background: rgba(16,16,24,0.72); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 6px; padding: 6px 9px; cursor: pointer;
}
.chip.on { color: var(--ink); background: var(--orange); border-color: var(--orange); font-weight: 700; }
#topbar .spacer { flex: 1; }
#todBtn, #trainBtn, #consoleBtn {
  font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
  color: var(--txt); background: rgba(16,16,24,0.72); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
#trainBtn { color: var(--orange); border-color: rgba(255,122,47,0.55); font-weight: 700; }
#trainBtn.warn { color: var(--ink); background: var(--orange); }

/* ---------- Trainings-Panel ---------- */
#trainPanel {
  position: absolute; top: 46px; right: 10px; width: 240px;
  background: rgba(10,10,16,0.88); border: 1px solid rgba(255,122,47,0.4); border-radius: 8px;
  padding: 8px 10px; font-family: var(--mono); font-size: 11px; color: var(--txt);
}
#trainTitle { color: var(--orange); letter-spacing: 2px; margin-bottom: 6px; font-weight: 700; }
#trainChart { width: 100%; height: 56px; display: block; margin-bottom: 6px; background: rgba(255,255,255,0.03); border-radius: 4px; }
#trainStats { color: var(--txt-dim); margin-bottom: 6px; line-height: 1.5; }
#trainStop {
  width: 100%; font-family: var(--mono); font-size: 11px; padding: 5px;
  color: var(--txt); background: rgba(255,60,60,0.15); border: 1px solid rgba(255,60,60,0.5);
  border-radius: 6px; cursor: pointer;
}

/* ---------- Joystick ---------- */
#joyZone {
  position: absolute; left: 0; bottom: 0; width: 46%; height: 62%;
  pointer-events: auto; display: flex; align-items: flex-end; justify-content: flex-start;
}
#joyBase {
  width: 132px; height: 132px; margin: 0 0 22px 22px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.16); background: rgba(16,16,24,0.42);
  position: relative; backdrop-filter: blur(2px);
}
#joyBase::after {
  content: ''; position: absolute; inset: 30%; border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.14);
}
#joyKnob {
  position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
  margin: -27px 0 0 -27px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,122,47,0.95), rgba(200,70,20,0.9));
  box-shadow: 0 4px 18px rgba(255,122,47,0.35);
}

/* ---------- Kontext-Buttons ---------- */
#btnStack {
  position: absolute; right: 12px; bottom: 86px;
  display: flex; flex-direction: column; gap: 10px; pointer-events: auto;
}
.cbtn {
  width: 84px; height: 58px; border-radius: 12px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 1px; font-weight: 700;
  color: var(--txt); background: rgba(16,16,24,0.75); border: 1px solid rgba(255,255,255,0.18);
  cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.4);
}
.cbtn:active { background: var(--orange); color: var(--ink); }

/* ---------- Farb-Dots ---------- */
#colorDots { position: absolute; left: 22px; bottom: 172px; display: flex; gap: 8px; pointer-events: auto; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); cursor: pointer; }
.dot.on { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.6); }

/* ---------- Status ---------- */
#statusLine {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--txt-dim);
  white-space: nowrap;
}

/* ---------- Konsole ---------- */
#console {
  position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
  background: rgba(6,6,10,0.94); border-top: 1px solid rgba(255,122,47,0.45);
  display: flex; flex-direction: column; pointer-events: auto; font-family: var(--mono);
}
#conLog { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 11px; line-height: 1.55; }
#conLog .ln { white-space: pre-wrap; }
#conLog .in { color: rgba(255,255,255,0.55); }
#conLog .sys { color: rgba(120, 220, 160, 0.9); }
#conLog .warn { color: rgba(255, 130, 90, 0.95); }
#conLog .gmi { color: rgba(140, 170, 255, 0.95); }
#conForm { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid rgba(255,255,255,0.1); }
#conInput {
  flex: 1; font-family: var(--mono); font-size: 12px; color: var(--txt);
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.16);
  border-radius: 6px; padding: 9px 10px; outline: none;
}
#conInput:focus { border-color: rgba(255,122,47,0.6); }
#conForm button {
  font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 0 14px; border-radius: 6px;
  border: 1px solid rgba(255,122,47,0.6); background: rgba(255,122,47,0.15); color: var(--orange); cursor: pointer;
}
#geminiBtn { border-color: rgba(140,170,255,0.6) !important; background: rgba(140,170,255,0.12) !important; color: #8caaff !important; }

/* ---------- Boot-Vorhang ---------- */
#bootVeil {
  position: fixed; inset: 0; background: var(--ink); z-index: 50;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.45s ease; opacity: 1;
}
#bootVeil.gone { opacity: 0; pointer-events: none; }
#bootLog {
  font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--orange);
  text-shadow: 0 0 8px rgba(255,122,47,0.35); white-space: pre-wrap;
}
@media (max-height: 420px) {
  #joyBase { width: 110px; height: 110px; margin-bottom: 12px; }
  .cbtn { width: 74px; height: 50px; }
  #console { height: 50%; }
}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="topbar">
    <div id="logo">TESTFELD·07</div>
    <div class="chips" id="robotChips"></div>
    <div class="chips" id="modeChips"></div>
    <div class="spacer"></div>
    <button id="todBtn">TAG</button>
    <button id="trainBtn">TRAIN ▶</button>
    <button id="consoleBtn">KONSOLE</button>
  </div>

  <div id="trainPanel" class="hidden">
    <div id="trainTitle">NEUROEVOLUTION</div>
    <canvas id="trainChart" width="220" height="56"></canvas>
    <div id="trainStats">—</div>
    <button id="trainStop">STOP</button>
  </div>

  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="btnStack"></div>
  <div id="colorDots"></div>
  <div id="statusLine">—</div>

  <div id="console" class="hidden">
    <div id="conLog"></div>
    <form id="conForm">
      <input id="conInput" autocomplete="off" spellcheck="false" placeholder='Befehl („hilfe") oder JSON {"cmd":...}'>
      <button type="submit">SENDEN</button>
      <button type="button" id="geminiBtn">GEMINI</button>
    </form>
  </div>

  <div id="bootVeil"><pre id="bootLog"></pre></div>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</div>
<script>
/* ======== rng.js ======== */
/* Testfeld·07 — Deterministischer Zufall
 * mulberry32 — MUSS bit-identisch zum Python-Spiegel (kaggle/robofield_common.py) sein.
 * Integer-Ops in 32-Bit, Division durch 2^32 → identische IEEE-Double-Ergebnisse.
 */
(function (global) {
  'use strict';

  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      t = (t ^ (t >>> 14)) >>> 0;
      return t / 4294967296;
    };
  }

  // Helfer: gleichverteilte Floats, identische Formeln wie im Python-Spiegel.
  function makeRng(seed) {
    var next = mulberry32(seed >>> 0);
    return {
      next: next,
      uniform: function (a, b) { return a + (b - a) * next(); },
      int: function (n) { return Math.floor(next() * n); }
    };
  }

  global.TF07 = global.TF07 || {};
  global.TF07.mulberry32 = mulberry32;
  global.TF07.makeRng = makeRng;
})(typeof window !== 'undefined' ? window : globalThis);


/* ======== nn.js ======== */
/* Testfeld·07 — Policy-Netz (MLP 2×32 tanh) + robofield-policy-v1
 *
 * Gewichts-Layout (verbindlich, identisch zum Kaggle-Spiegel):
 *   flat = [W1 (32×obs, row-major), b1 (32), W2 (32×32, row-major), b2 (32), W3 (act×32, row-major), b3 (act)]
 *   y = tanh(W·x + b) in jeder Schicht, Ausgang tanh → Skalierung durch Aktionsgrenzen der Env.
 *
 * Policy-Format (verbindlich):
 * {
 *   "format": "robofield-policy-v1",
 *   "robot": "duck | arm | humanoid",
 *   "arch": [obs, 32, 32, act],
 *   "weights": [ [...], [...], ... 6 Tensoren als Zahlen-Arrays ],
 *   "gen": 0, "fit": 0.0, "src": "kaggle | lokal | import"
 * }
 */
(function (global) {
  'use strict';

  var HIDDEN = 32;

  function weightCount(obs, act) {
    return obs * HIDDEN + HIDDEN + HIDDEN * HIDDEN + HIDDEN + act * HIDDEN + act;
  }

  function sliceSizes(obs, act) {
    return [obs * HIDDEN, HIDDEN, HIDDEN * HIDDEN, HIDDEN, act * HIDDEN, act];
  }

  // Aktionen begrenzen pro Roboter (Env kennt die Grenzen ebenfalls)
  var ACT_LIMITS = { duck: 4.0, arm: 1.6, humanoid: 1.0 };

  function forward(flat, obs, nAct) {
    // flat: Float64Array; obs: Float64Array(len obs) → Float64Array(nAct) in [-1,1]
    var o = obs.length;
    var w1 = 0, b1 = o * HIDDEN;
    var w2 = b1 + HIDDEN, b2 = w2 + HIDDEN * HIDDEN;
    var w3 = b2 + HIDDEN, b3 = w3 + nAct * HIDDEN;
    var h1 = new Float64Array(HIDDEN);
    var h2 = new Float64Array(HIDDEN);
    var out = new Float64Array(nAct);
    var i, j, s;
    for (i = 0; i < HIDDEN; i++) {
      s = flat[b1 + i];
      for (j = 0; j < o; j++) s += flat[w1 + i * o + j] * obs[j];
      h1[i] = Math.tanh(s);
    }
    for (i = 0; i < HIDDEN; i++) {
      s = flat[b2 + i];
      for (j = 0; j < HIDDEN; j++) s += flat[w2 + i * HIDDEN + j] * h1[j];
      h2[i] = Math.tanh(s);
    }
    for (i = 0; i < nAct; i++) {
      s = flat[b3 + i];
      for (j = 0; j < HIDDEN; j++) s += flat[w3 + i * HIDDEN + j] * h2[j];
      out[i] = Math.tanh(s);
    }
    return out;
  }

  function genomeToPolicy(flat, robot, gen, fit, src) {
    var arch = ARCHS[robot];
    var sizes = sliceSizes(arch[0], arch[3]);
    var weights = [];
    var off = 0;
    for (var k = 0; k < 6; k++) {
      weights.push(Array.from(flat.slice(off, off + sizes[k])));
      off += sizes[k];
    }
    return {
      format: 'robofield-policy-v1',
      robot: robot,
      arch: arch.slice(),
      weights: weights,
      gen: gen || 0,
      fit: fit || 0.0,
      src: src || 'lokal'
    };
  }

  function policyToGenome(policy) {
    var arr = [];
    for (var k = 0; k < policy.weights.length; k++) {
      var w = policy.weights[k];
      for (var i = 0; i < w.length; i++) arr.push(w[i]);
    }
    return Float64Array.from(arr);
  }

  var ARCHS = {
    duck: [12, HIDDEN, HIDDEN, 2],
    arm: [15, HIDDEN, HIDDEN, 5],
    humanoid: [10, HIDDEN, HIDDEN, 5]
  };

  // Validierung gegen die App-Architektur
  function validatePolicy(policy) {
    function err(m) { return { ok: false, error: m }; }
    if (!policy || typeof policy !== 'object') return err('Kein JSON-Objekt');
    if (policy.format !== 'robofield-policy-v1') return err('format != robofield-policy-v1');
    var arch = ARCHS[policy.robot];
    if (!arch) return err('unbekannter Roboter: ' + policy.robot);
    if (!Array.isArray(policy.arch) || policy.arch.length !== 4) return err('arch muss 4 Einträge haben');
    for (var i = 0; i < 4; i++) if (policy.arch[i] !== arch[i]) return err('arch[' + i + ']=' + policy.arch[i] + ', erwartet ' + arch[i]);
    if (!Array.isArray(policy.weights) || policy.weights.length !== 6) return err('weights muss 6 Tensoren enthalten');
    var sizes = sliceSizes(arch[0], arch[3]);
    var total = 0;
    for (i = 0; i < 6; i++) {
      if (!Array.isArray(policy.weights[i])) return err('weights[' + i + '] ist kein Array');
      if (policy.weights[i].length !== sizes[i]) return err('weights[' + i + '].length=' + policy.weights[i].length + ', erwartet ' + sizes[i]);
      for (var j = 0; j < policy.weights[i].length; j++) {
        var v = policy.weights[i][j];
        if (typeof v !== 'number' || !isFinite(v)) return err('weights[' + i + '][' + j + '] keine endliche Zahl');
      }
      total += sizes[i];
    }
    if (total !== weightCount(arch[0], arch[3])) return err('Gewichtsgesamtzahl falsch');
    return { ok: true, error: null, genome: policyToGenome(policy), count: total };
  }

  // Deterministische Erst-Initialisierung (Xavier-Grenze), für Tests + Factory-Champion
  function initGenome(seed, obs, act) {
    var rng = global.TF07.makeRng(seed);
    var flat = new Float64Array(weightCount(obs, act));
    var sizes = sliceSizes(obs, act);
    var fanPairs = [];
    fanPairs.push([obs, HIDDEN]); fanPairs.push([HIDDEN, 0]);
    fanPairs.push([HIDDEN, HIDDEN]); fanPairs.push([HIDDEN, 0]);
    fanPairs.push([HIDDEN, act]); fanPairs.push([act, 0]);
    var off = 0;
    for (var k = 0; k < 6; k++) {
      var lim = fanPairs[k][1] === 0 ? 0.1 : Math.sqrt(6 / (fanPairs[k][0] + fanPairs[k][1]));
      for (var i = 0; i < sizes[k]; i++) flat[off + i] = rng.uniform(-lim, lim);
      off += sizes[k];
    }
    return flat;
  }

  global.TF07 = global.TF07 || {};
  global.TF07.nn = {
    HIDDEN: HIDDEN,
    ARCHS: ARCHS,
    ACT_LIMITS: ACT_LIMITS,
    weightCount: weightCount,
    sliceSizes: sliceSizes,
    forward: forward,
    initGenome: initGenome,
    genomeToPolicy: genomeToPolicy,
    policyToGenome: policyToGenome,
    validatePolicy: validatePolicy
  };
})(typeof window !== 'undefined' ? window : globalThis);


/* ======== envs.js ======== */
/* Testfeld·07 — Umgebungen (deterministische Kernphysik)
 *
 * Diese Datei ist der EINZIGE Wahrheitsquelle für Env-Mathematik.
 * Der Kaggle-Spiegel (kaggle/train_*.py) implementiert exakt dieselben
 * Formeln in derselben Reihenfolge. Gilt:
 *   gleicher Seed + gleiche Gewichte → gleicher Reward (Toleranz 1e-6,
 *   real ~1e-12; Restdifferenz kommt von libm-1-ulp-Unterschieden in sin/cos).
 *
 * Kein DOM, kein Renderer — reine Logik (läuft in Node für Tests).
 */
(function (global) {
  'use strict';
  var TF = global.TF07 = global.TF07 || {};

  var DT = 1 / 30;            // Env-Fixed-Step (30 Hz)
  var ARENA_HALF = 10;        // Arena 20×20 m
  var RAY_LEN = 4.0;          // Duck-Sensorreichweite
  var N_RAYS = 9;
  var RAY_SPREAD = 100 * Math.PI / 180;  // ±100° Gesamtfächer
  var DUCK_R = 0.22;          // Duck-Kollisionsradius
  var WHEEL_R = 0.12, WHEEL_B = 0.14, W_MAX = 4.0;
  var N_OBS = 12;             // Hindernis-Zylinder
  var EP_DUCK = 600;          // 20 s

  var ARM = { L1: 0.55, L2: 0.45, L3: 0.25, HB: 0.5, VMAX: 1.6,
              Q1: 2.9, Q2: 1.4, Q3: 2.2, Q4: 1.6, BALL_R: 0.09,
              EP: 450, GRIP_D: 0.14, DELIVER_D: 0.25 };
  ARM.DZ = [0.75, ARM.BALL_R, -0.75]; // Abgabezone (fix, aus Obs ableitbar)

  var HUM = { H: 0.85, G: 9.81, EP: 600, LEAN: 0.12, STEP_T: 0.7 };

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  TF.clamp = clamp;

  /* ============================ MICRODUCK ============================
   * Differential-Drive, 9 Strahl-Sensoren, Zielsuche zwischen 12 Zylindern.
   * obs(12): 9×Ray(normalisiert), sin/cos(relWinkel), dist/12
   * act(2):  Radgeschwindigkeiten normalisiert [-1,1] → ±4 rad/s
   * Reward: 5×Fortschritt − 0.1×Kollision + 25×Ziel
   */
  function DuckEnv(seed) { this.reset(seed === undefined ? 1 : seed); }

  DuckEnv.prototype.reset = function (seed) {
    var rng = TF.makeRng(seed >>> 0);
    this.rngSeed = seed >>> 0;
    this.rng = rng;
    // Hindernisse: Rejection-Sampling (x,z ≥ 2.5 m vom Zentrum), dann r,h
    this.obsP = [];
    for (var i = 0; i < N_OBS; i++) {
      var x, z, d;
      do {
        x = rng.uniform(-8.5, 8.5); z = rng.uniform(-8.5, 8.5);
        d = Math.sqrt(x * x + z * z);
      } while (d < 2.5);
      var r = rng.uniform(0.35, 0.85);
      var h = rng.uniform(0.8, 1.4);
      this.obsP.push({ x: x, z: z, r: r, h: h });
    }
    this.x = 0; this.z = 0;
    this.heading = rng.uniform(-Math.PI, Math.PI);
    this.steps = 0; this.fit = 0; this.reached = 0; this.collision = false;
    this.rays = new Float64Array(N_RAYS);
    this._newTarget(rng);
    this._updateDist();
    this.prevDist = this.dist;
    return this.getObs();
  };

  DuckEnv.prototype._newTarget = function (rng) {
    for (;;) {
      var tx = rng.uniform(-8.5, 8.5), tz = rng.uniform(-8.5, 8.5);
      var dx = tx - this.x, dz = tz - this.z;
      if (Math.sqrt(dx * dx + dz * dz) <= 3.0) continue;
      var ok = true;
      for (var i = 0; i < this.obsP.length; i++) {
        var o = this.obsP[i];
        var ax = tx - o.x, az = tz - o.z;
        if (Math.sqrt(ax * ax + az * az) <= o.r + 0.6) { ok = false; break; }
      }
      if (ok) { this.tx = tx; this.tz = tz; return; }
    }
  };

  DuckEnv.prototype._updateDist = function () {
    var dx = this.tx - this.x, dz = this.tz - this.z;
    this.dist = Math.sqrt(dx * dx + dz * dz);
  };

  DuckEnv.prototype._computeRays = function () {
    var px = this.x, pz = this.z, half = ARENA_HALF;
    for (var i = 0; i < N_RAYS; i++) {
      var a = this.heading + (i - 4) / 4 * RAY_SPREAD;
      var dx = Math.cos(a), dz = Math.sin(a);
      var tMin = RAY_LEN;
      // Wände
      if (dx > 1e-12) { var t = (half - px) / dx; if (t >= 0 && t < tMin) tMin = t; }
      if (dx < -1e-12) { t = (-half - px) / dx; if (t >= 0 && t < tMin) tMin = t; }
      if (dz > 1e-12) { t = (half - pz) / dz; if (t >= 0 && t < tMin) tMin = t; }
      if (dz < -1e-12) { t = (-half - pz) / dz; if (t >= 0 && t < tMin) tMin = t; }
      // Zylinder (aufgebläht um DUCK_R — konsistent zur Kollision)
      for (var k = 0; k < this.obsP.length; k++) {
        var o = this.obsP[k];
        var rx = o.x - px, rz = o.z - pz;
        var to = rx * dx + rz * dz;
        if (to <= 0) continue;
        var c2 = rx * rx + rz * rz - to * to;
        var rr = o.r + DUCK_R;
        if (c2 < rr * rr) {
          var th = to - Math.sqrt(rr * rr - c2);
          if (th >= 0 && th < tMin) tMin = th;
        }
      }
      this.rays[i] = clamp(tMin / RAY_LEN, 0, 1);
    }
  };

  DuckEnv.prototype.getObs = function () {
    this._computeRays();
    var o = new Float64Array(12);

  /* ---------------- MICRODUCK-Rig ---------------- */
  function DuckRig(lib, opts) {
    opts = opts || {};
    var ghost = !!opts.ghost;
    var a = ghost ? 0.22 : 1;
    function c(rgb) { return [rgb[0], rgb[1], rgb[2], a]; }
    var root = new R.Node();
    var bodyC = c(opts.color || COL.orange);

    var beak = new R.Node(lib.cone, c([1, 0.69, 0.18]));

    root.add(beak);
    var eyeL = new R.Node(lib.unitSphere, c(COL.eye));
    eyeL.scale = [0.03, 0.03, 0.03]; eyeL.pos = [0.24, 0.47, 0.09];
    root.add(eyeL);
    var eyeR = new R.Node(lib.unitSphere, c(COL.eye));
    eyeR.scale = [0.03, 0.03, 0.03]; eyeR.pos = [0.24, 0.47, -0.09];
    root.add(eyeR);

    var wheels = [];
    for (var s = -1; s <= 1; s += 2) {
      var w = new R.Node(lib.unitCyl, c(COL.wheel));
      w.scale = [0.12, 0.07, 0.12];
      w.quat = R.quatAxis([1, 0, 0], Math.PI / 2);
      w.pos = [0, 0.12, s * 0.16];
      root.add(w);
      var hub = new R.Node(lib.unitCyl, c(COL.orangeDim));
      hub.scale = [0.05, 0.078, 0.05];
      hub.quat = R.quatAxis([1, 0, 0], Math.PI / 2);
      hub.pos = [0, 0.12, s * 0.16];

      spin: 0,

        root.pos[0] = env.x; root.pos[1] = 0; root.pos[2] = env.z;
        root.quat = R.quatAxis([0, 1, 0], -env.heading);
        // Rad-Drehung
        var v = TF.WHEEL_R * 0; // Spin visuell aus Aktionen via setSpin()
        this.spin += this.spinRate || 0;
        var ang = this.spin;
        for (var i = 0; i < wheels.length; i++) {
          var q = R.quatAxis([1, 0, 0], Math.PI / 2);

          for (i = 0; i < TF.N_RAYS; i++) {
            var aAbs = env.heading + (i - 4) / 4 * TF.RAY_SPREAD;
            var len = Math.max(0.05, env.rays[i] * TF.RAY_LEN);
            var bar = this.rayBars[i];
            bar.pos = [env.x + Math.cos(aAbs) * len / 2, 0.16, env.z + Math.sin(aAbs) * len / 2];
            bar.quat = R.quatAxis([0, 1, 0], -aAbs);
            bar.scale = [len, 0.012, 0.012];
            var heat = 1 - env.rays[i];
            bar.color = [0.2 + heat * 0.8, 0.9 - heat * 0.7, 0.3, 0.35];
          }
        }
      }
    };
  }

  /* ---------------- ARMBOT-Rig ---------------- */
  function ArmRig(lib, opts) {

        ball.visible = true;

    };
  }

  /* ---------------- HUMANOID-Rig ---------------- */
  function HumanoidRig(lib, opts) {
    opts = opts || {};

    }

    /* ---------- Geister ---------- */
    function buildGhosts(robot) {
      clearGhosts();
      var mk = robot === 'duck' ? TF.views.DuckRig : robot === 'arm' ? TF.views.ArmRig : TF.views.HumanoidRig;
      for (var k = 0; k < 8; k++) {
        var rig = mk(lib, { ghost: true });
        worlds[robot].arena.add(rig.root);
        ghostRigs.push(rig);
      }
      S.training.batchFits = new Float64Array(8);
    }
    function clearGhosts() {
      for (var k = 0; k < ghostRigs.length; k++) {
        ghostRigs[k].root.parent = null; // einfaches Entfernen
      }
      ghostRigs = [];
    }

    /* ---------- Aktionen (Konsole/UI) ---------- */
    this.setRobot = function (id) {
      S.robot = id;
      S.gripClosed = false;
      cam.yaw = CAM_DEF[id].yaw; cam.pitch = CAM_DEF[id].pitch; cam.dist = CAM_DEF[id].dist;
      for (var r in worlds) worlds[r].arena.visible = (r === id) && true;
      if (S.training.active && S.training.robot !== id) this.stopTraining();
      TF.ui.logLine('Roboter: ' + id.toUpperCase(), 'sys');
      TF.ui.status('ROBOT ' + id.toUpperCase() + ' / ' + S.mode.toUpperCase());
      save();
    };
    this.setMode = function (m) {
      S.mode = m;
      if (m === 'policy') {
        if (!S.champions[S.robot]) TF.ui.logLine('Noch kein Champion für ' + S.robot.toUpperCase() + ' — erst TRAINING starten oder Policy importieren.', 'warn');
        else TF.ui.logLine('POLICY-MODUS: Champion gen ' + S.champions[S.robot].gen + ', fit ' + S.champions[S.robot].fit.toFixed(1) + '.', 'sys');
      } else TF.ui.logLine('Modus: MANUELL.', 'sys');
      TF.ui.buildTopbar();
      save();
    };
    this.setTod = function (t) {
      S.tod = t;
      TF.ui.logLine('Tageszeit: ' + { day: 'Tag', sunset: 'Abendrot', night: 'Nacht' }[t] + '.', 'sys');
      save();
    };
    this.setColorIdx = function (i) {
      S.colorIdx = i;
      rebuildDuck();
      save();
    };
    function rebuildDuck() {
      var w = worlds.duck;
      var parent = w.arena;
      parent.children = parent.children.filter(function (c) { return c !== w.rig.root; });
      w.rig = TF.views.DuckRig(lib, { color: COLOR_CHOICES[S.colorIdx].rgb });
      parent.add(w.rig.root);
      w.rig.root.visible = !(S.training.active && S.training.robot === 'duck');
    }
    this.toggleRays = function () {
      S.showRays = !S.showRays;
      TF.ui.status('Strahlen: ' + (S.showRays ? 'AN' : 'AUS'));
      save();
    };
    this.haltHumanoid = function () { this.joystick.y = 0; };
    this.resetRobot = function () {
      envs[S.robot].reset(envs[S.robot].rngSeed || 1);
      TF.ui.logLine(S.robot.toUpperCase() + ' zurückgesetzt.', 'sys');
    };
    this.newTarget = function () {
      var e = envs[S.robot];
      if (S.robot === 'duck') { e._newTarget(e.rng); }
      else if (S.robot === 'arm') { e._newBall(e.rng); e.holding = false; e.prevEB = e._d3(e.ee, e.ball); }
      else e._newTarget(e.rng);
      TF.ui.logLine('Neues Ziel für ' + S.robot.toUpperCase() + '.', 'sys');
    };

    /* ---------- Champion-Verwaltung ---------- */
    this.importPolicyText = function (text, fname) {
      try {
        var p = JSON.parse(text);
        this.importPolicyObj(p, fname);
      } catch (e) {
        TF.ui.logLine('Import fehlgeschlagen: ' + e.message, 'warn');
      }
    };
    this.importPolicyObj = function (p, fname) {
      var v = TF.nn.validatePolicy(p);
      if (!v.ok) { TF.ui.logLine('Policy abgelehnt: ' + v.error, 'warn'); return; }
      S.champions[p.robot] = { genome: v.genome, gen: p.gen || 0, fit: p.fit || 0, src: p.src || 'import' };
      TF.ui.logLine('Policy importiert' + (fname ? ' (' + fname + ')' : '') + ': ' + p.robot.toUpperCase() + ', gen ' + p.gen + ', fit ' + (p.fit || 0).toFixed(1) + ', src ' + (p.src || 'import') + '.', 'sys');
      if (S.robot === p.robot && S.mode === 'policy') { /* greift sofort */ }
      save();
    };
    this.championPolicyJson = function () {
      var c = S.champions[S.robot];
      if (!c) return null;
      return JSON.stringify(TF.nn.genomeToPolicy(c.genome, S.robot, c.gen, c.fit, c.src));
    };
    this.exportChampion = function () {
      var j = this.championPolicyJson();
      if (!j) { TF.ui.logLine('Kein Champion für ' + S.robot.toUpperCase() + ' — nichts zu exportieren.', 'warn'); return; }
      var d = new Date();
      var name = 'robofield-' + S.robot + '-gen' + S.champions[S.robot].gen + '-' + d.toISOString().slice(0, 10) + '.json';
      if (global.AndroidBridge && global.AndroidBridge.exportFile) {
        global.AndroidBridge.exportFile(name, j);
        TF.ui.logLine('Exportiert über Android-Bridge: ' + name, 'sys');
      } else {
        try {
          var blob = new Blob([j], { type: 'application/json' });
          var a = global.document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = name;
          a.click();
          TF.ui.logLine('Download gestartet: ' + name, 'sys');
        } catch (e) { TF.ui.logLine('Export nicht möglich: ' + e.message, 'warn'); }
      }
    };
    this.saveChampionNamed = function (name) {
      var c = S.champions[S.robot];
      if (!c) { TF.ui.logLine('Kein Champion zum Speichern.', 'warn'); return; }
      var j = JSON.stringify(TF.nn.genomeToPolicy(c.genome, S.robot, c.gen, c.fit, 'lokal'));
      var fname = (name || S.robot + '-champion') + '.json';
      if (global.AndroidBridge && global.AndroidBridge.exportFile) global.AndroidBridge.exportFile(fname, j);
      else this.exportChampion();
      TF.ui.logLine('Gespeichert: ' + fname, 'sys');
    };

    /* ---------- Konsole ---------- */
    this.handleConsole = function (s) {
      // Policy-JSON direkt einfügen?
      if (s[0] === '{') {
        try {
          var o = JSON.parse(s);
          if (o && o.format === 'robofield-policy-v1') { this.importPolicyObj(o); return; }
        } catch (e) { /* weiter zum Normalparser */ }
      }
      var res = TF.console.handle(s, S);
      for (var i = 0; i < res.replies.length; i++) TF.ui.logLine(res.replies[i], res.actions.length ? 'sys' : 'warn');
      this.execActions(res.actions);
    };
    this.execActions = function (acts) {
      for (var i = 0; i < acts.length; i++) {
        var a = acts[i];
        switch (a.op) {
          case 'train': this.startTraining(a.robot, a.gens); break;
          case 'trainStop': this.stopTraining(); break;
          case 'robot': this.setRobot(a.id); TF.ui.buildBtnStack(); TF.ui.buildTopbar(); break;
          case 'mode': this.setMode(a.mode); break;
          case 'tod': this.setTod(a.tod); TF.ui.buildTopbar(); break;
          case 'save': this.saveChampionNamed(a.name); break;
          case 'load': TF.ui.logLine('Laden: gespeicherte Champions liegen im Browser-Speicher; Datei über „import" wählen.', 'sys'); TF.ui.openImport(); break;
          case 'reset': this.resetRobot(); break;
          case 'target': this.newTarget(); break;
          case 'export': this.exportChampion(); break;
          case 'status': this.reportStatus(); break;
          case 'importPolicy': this.importPolicyObj(a.policy); break;
          case 'quack': this.quack(); break;
          case 'fileImport': TF.ui.openImport(); break;
        }
      }
    };
    this.reportStatus = function () {
      var T = S.training;
      var lines = [
        'STATUS — Roboter: ' + S.robot.toUpperCase() + ' | Modus: ' + S.mode.toUpperCase() + ' | TOD: ' + S.tod.toUpperCase(),
        'Champions: ' + ['duck', 'arm', 'humanoid'].map(function (r) {
          var c = S.champions[r];
          return r + (c ? '(gen ' + c.gen + ', fit ' + c.fit.toFixed(1) + ', ' + c.src + ')' : '(—)');
        }).join('  '),
        'Training: ' + (T.active ? 'AKTIV gen ' + T.gen + '/' + T.gens + ', best ' + (T.bestFit === null ? '—' : T.bestFit.toFixed(1)) : 'inaktiv'),
        'Env: ' + S.robot + ' fit=' + envs[S.robot].fit.toFixed(1) + ' steps=' + (envs[S.robot].steps || 0)
      ];
      for (var i = 0; i < lines.length; i++) TF.ui.logLine(lines[i], 'sys');
    };

    /* ---------- Gemini-Brücke ---------- */
    var GEMINI_SYS = [
      'Du bist die Fernsteuerung der Robotik-Sandbox "Testfeld·07".',
      'Antworte AUSSCHLIESSLICH mit JSON-Kommandos dieses Protokolls (kein weiterer Text):',
      '{"cmd":"train","robot":"duck|arm|humanoid","gens":N}',
      '{"cmd":"robot","id":"duck|arm|humanoid"}',
      '{"cmd":"mode","mode":"manual|policy"}',
      '{"cmd":"tod","tod":"day|sunset|night"}',
      '{"cmd":"save","name":"..."}  {"cmd":"load","name":"..."}',
      '{"cmd":"reset"}  {"cmd":"status"}  {"cmd":"target"}  {"cmd":"export"}',
      'Mehrere Befehle: als JSON-Array [ {...}, {...} ].',
      'Roboter: duck=Roller (Zielsuche), arm=Greifarm, humanoid=Balance-Läufer.'
    ].join('\n');
    this.askGemini = function (q) {
      var key = null;
      try { key = global.localStorage.getItem('tf07.gk'); } catch (e) {}
      if (!key) {
        key = global.prompt('Gemini-API-Key (wird nur lokal im Gerät gespeichert):');
        if (!key) { TF.ui.logLine('GEMINI: ohne Key abgebrochen.', 'warn'); return; }
        try { global.localStorage.setItem('tf07.gk', key); } catch (e) {}
      }
      TF.ui.logLine('GEMINI › ' + q, 'gmi');
      var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(key);
      global.fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: GEMINI_SYS }] },
          contents: [{ role: 'user', parts: [{ text: q }] }]
        })
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 400 ? ' (Key ungültig?)' : ''));
        return r.json();
      }).then(function (data) {
        var txt = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
          data.candidates[0].content.parts && data.candidates[0].content.parts[0].text || '';
        txt = txt.trim().replace(/^```(json)?/m, '').replace(/```$/m, '').trim();
        TF.ui.logLine('GEMINI: ' + txt, 'gmi');
        self.handleConsole(txt);
      }).catch(function (e) {
        TF.ui.logLine('GEMINI-Fehler: ' + e.message + ' (Netzwerk/Key prüfen — App ist sonst offline)', 'warn');
      });
    };

    /* ---------- Hauptschleife ---------- */
    var last = performance.now(), acc = 0, fpsT = 0, fpsN = 0, timeS = 0;
    var mainGenome = null, mainActs = null;

    function stepMain(dt) {
      var env = envs[S.robot];
      var arch = TF.nn.ARCHS[S.robot];
      if (S.mode === 'policy' && S.champions[S.robot]) {
        var acts = TF.nn.forward(S.champions[S.robot].genome, env.getObs(), arch[3]);
        if (S.robot === 'duck') { env.step(acts[0], acts[1]); worlds.duck.rig.spinRate = (acts[0] + acts[1]) / 2 * 4 / TF.WHEEL_R * TF.DT; }
        else if (S.robot === 'arm') { env.step(acts[0], acts[1], acts[2], acts[3], acts[4]); env.gripOpen = acts[4] > 0; }
        else env.step(acts);
      } else {
        var a = manualActions(env);
        if (S.robot === 'duck') {
          env.step(a[0], a[1]);
          var v = TF.WHEEL_R * (a[0] + a[1]) * 4 / 2;
          worlds.duck.rig.spinRate = v / TF.WHEEL_R * TF.DT;
        } else if (S.robot === 'arm') {
          env.step(a[0], a[1], a[2], a[3], a[4]);
          env.gripOpen = !S.gripClosed;
        } else env.step(a);
      }
      if (env.steps !== undefined && env.steps >= TF.EP_LEN[S.robot]) env.reset(env.rngSeed || 1);
    }

    function applyTod() {
      var t = TOD[S.tod];
      renderer.bg = t.bg; renderer.fogColor = t.bg; renderer.fogDensity = t.fog;
      renderer.lightColor = t.light; renderer.ambSky = t.sky; renderer.ambGnd = t.gnd;
      renderer.lightDir = t.dir;
    }

    var lastErrMsg = '', lastErrT = 0;
    function frame(now) {
      try {
        frameInner(now);
      } catch (e) {
        if (e.message !== lastErrMsg || now - lastErrT > 1000) {
          lastErrMsg = e.message; lastErrT = now;
          TF.ui.logLine('LOOP-FEHLER: ' + e.message, 'warn');
          try { console.error('TF07 loop error:', e); } catch (_) {}
        }
      }
      requestAnimationFrame(frame);
    }

    function frameInner(now) {
      var dt = Math.min(0.1, (now - last) / 1000);
      last = now; timeS += dt;
      fpsN++; if (now - fpsT > 500) { S.fps = Math.round(fpsN * 1000 / (now - fpsT)); fpsT = now; fpsN = 0; }

      if (!S.training.active) {
        acc += dt;
        var n = 0;
        while (acc >= TF.DT && n < 4) { stepMain(TF.DT); acc -= TF.DT; n++; }
      } else {
        trainStep();
        TF.ui.updateTraining(S.training);
      }

      applyTod();
      var env = envs[S.robot], w = worlds[S.robot];
      // Szenengraph-Transforme aktualisieren (vor dem Zeichnen!)
      w.arena.updateWorld(null);
      // Rig-Updates
      if (S.robot === 'duck') {
        w.rig.update(env);
        w.rig.rayBars.forEach(function (b) { b.visible = S.showRays && !S.training.active; });
      } else if (S.robot === 'arm') w.rig.update(env);
      else w.rig.update(env);
      // Zielmarker
      var showT = S.robot !== 'arm';
      w.target.root.visible = showT;
      if (showT) {
        var tx = S.robot === 'duck' ? env.tx : env.tx, tz = env.tz;
        w.target.root.pos = [tx, 0, tz];
        var pulse = 1 + 0.12 * Math.sin(timeS * 4);
        w.target.ring.scale = [pulse, 1, pulse];
      }
      // Kamera
      var focus = S.robot === 'arm' ? [0, 0.7, 0] : [env.px !== undefined ? env.px : env.x, CAM_DEF[S.robot].ty, env.pz !== undefined ? env.pz : env.z];
      var cx = focus[0] + cam.dist * Math.cos(cam.pitch) * Math.sin(cam.yaw);
      var cy = focus[1] + cam.dist * Math.sin(cam.pitch);
      var cz = focus[2] + cam.dist * Math.cos(cam.pitch) * Math.cos(cam.yaw);
      renderer.camDist = cam.dist;
      renderer.setCamera([cx, cy, cz], focus, [0, 1, 0]);
      renderer.begin();
      renderer.drawNode(w.arena, 1);

      TF.ui.status(S.mode.toUpperCase() + ' · ' + S.robot.toUpperCase() + ' · ' + S.fps + ' FPS' +
        (S.training.active ? ' · TRAIN GEN ' + S.training.gen + '/' + S.training.gens : '') +
        ' · FIT ' + env.fit.toFixed(1));

      requestAnimationFrame(frame);
    }

    this.resize = function () {
      renderer.setSize(global.innerWidth, global.innerHeight, global.devicePixelRatio || 1);
    };

    /* ---------- Boot ---------- */
    this.boot = function () {
      load();
      TF.ui.init(this);
      this.resize();
      for (var r in worlds) worlds[r].arena.visible = (r === S.robot);
      worlds.duck.rig.root.visible = true;
      rebuildDuck();
      var glInfo = '';
      try { glInfo = renderer.gl.getParameter(renderer.gl.RENDERER) || 'WebGL'; } catch (e) { glInfo = 'WebGL'; }
      var lsOk = true;
      try { global.localStorage.setItem('tf07.test', '1'); global.localStorage.removeItem('tf07.test'); } catch (e) { lsOk = false; }
      TF.ui.bootSequence([
        'TESTFELD·07 BIOS v1.0.0 — (c) Werkstatt',
        'CPU: WEBVIEW-ARM64 ................ OK',
        'GRAFIK: ' + String(glInfo).slice(0, 28) + ' ... OK',
        'PHYSIK: TF07-KERN @ 30 Hz ......... OK',
        'ROBOTER: MICRODUCK / ARMBOT / HUMANOID ... 3 GEFUNDEN',
        'POLICY-FORMAT: robofield-policy-v1 ....... BEREIT',
        'STORAGE: ' + (lsOk ? 'OK' : 'OFFLINE-MODUS (ohne Speicherung)'),
        (S.champions.duck || S.champions.arm || S.champions.humanoid) ? 'CHAMPIONS: GELADEN' : 'CHAMPIONS: NOCH KEINE — TIPPE „TRAIN" ODER „TRAINIERE DEN DUCK 120 GENERATIONEN"',
        'STARTEN DER SANDBOX …'
      ], function () {
        TF.ui.logLine('Willkommen in der Werkstatt. „hilfe" zeigt alle Befehle (Deutsch + JSON).', 'sys');
        if (global.AndroidBridge) TF.ui.logLine('Android-Bridge erkannt: Export/Import in Dokumente möglich.', 'sys');
      });
      requestAnimationFrame(frame);
    };
  }

  TF.app = app;
  global.addEventListener('DOMContentLoaded', function () {
    var a = new app();
    global.TF07.inst = a;
    a.boot();
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
