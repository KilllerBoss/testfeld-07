plugins {
    id 'com.android.application'
}

android {
    namespace 'com.trainrobot.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.trainrobot.app"
        // minSdk 30 wie die Referenz-App (MicroDuck): moderner WebView/WebGL-Stapel
        minSdk 30
        targetSdk 35
        versionCode 5          // v2.1: ROBOLAB (Armbot + Humanoid) zurueck, Vollbild-Sim ohne Overlay-Buttons
        versionName "2.1.0"
    }

    // Release-APK debug-signiert -> direkt installierbar (Projekt-Vorgabe).
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // APK-Name: Trainrobot.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Trainrobot.apk"
        }
    }
}

dependencies {
    // WebViewAssetLoader: serviert assets/sim/ ueber https://appassets.androidplatform.net
    // (exakt wie die Referenz-App) — relative fetches, ES-Module und WASM funktionieren
    // damit offline; file:// wird NICHT mehr benutzt.
    implementation("androidx.webkit:webkit:1.11.0")
}
